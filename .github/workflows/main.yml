name: AI Co-Author Blocker

on: [push, pull_request]

jobs:
  block-ai-authors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI co-author trailers
        run: |
          # tag 推送/首推时 event.before 为全零 SHA，直接用 HEAD~ 会导致
          # "Invalid revision range" 而使检查永久失败（ruleset 死锁），需兜底。
          RANGE="HEAD~1..HEAD"
          if [ -n "${{ github.event.before }}" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          COMMITS=$(git log --format=%B $RANGE)
          
          if ! echo "$COMMITS" | grep -qi "Co-Authored-By:"; then
            echo "✅ 没有共同作者署名，检查通过。"
            exit 0
          fi

          AI_BLACKLIST="Claude|Anthropic|Copilot|Cursor|ChatGPT|OpenAI|GPT-4|GPT-3|Gemini|Codeium|Tabnine|Bard|Trae|Trae AI|Codex|Devin|Perplexity"
          
          INVALID=$(echo "$COMMITS" | grep -Ei "Co-Authored-By:.*($AI_BLACKLIST)")
          
          if [ -n "$INVALID" ]; then
            echo "❌ 拦截成功：检测到 AI 共同作者署名！"
            echo "违规内容："
            echo "$INVALID"
            exit 1
          fi
          
          echo "✅ 共同作者中没有 AI 署名，检查通过。"
